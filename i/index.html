<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽつり - 招待</title>
<meta name="description" content="仲良しだけの、ちいさな近況">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ぽつり">
<meta property="og:title" content="ぽつり - 招待">
<meta property="og:description" content="仲良しだけの、ちいさな近況">
<meta property="og:image" content="https://yuchin0809.github.io/i/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://yuchin0809.github.io/i/">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --pearl: #ECEEF8; --ink: #0B0A22; --sub: #5B5E7A; --lime: #C8F54B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--pearl); color: var(--ink); }
  body { font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 10px 30px rgba(11,10,34,.18); }
  h1 { font-size: 30px; line-height: 1.35; margin: 26px 0 10px; font-weight: 900; }
  p { color: var(--sub); font-size: 15px; line-height: 1.7; margin: 0; }
  .open { display: block; margin: 30px 0 0; padding: 20px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 18px; font-weight: 800; text-decoration: none; }
  .open:active { opacity: .75; }
  .note { margin-top: 30px; padding-top: 22px; border-top: 1px solid rgba(11,10,34,.1); font-size: 13px; }
  .bad { display: none; }
  .bad.show { display: block; margin-top: 26px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="ぽつり">
  <h1>ぽつりのグループに<br>招待されています</h1>
  <p>下のボタンを押すと、ぽつりが開いて<br>そのままグループに入れます。</p>
  <a class="open" id="open" href="potsuri://join">ぽつりで開いて参加する</a>
  <p class="bad" id="bad">このリンクは最後まで読み込めていないようです。<br>届いたメッセージのリンクを、もう一度開いてください。</p>
  <p class="note">ぽつりをまだ入れていない人は、App Storeで「ぽつり」を入れてから、もう一度このリンクを開いてください。iPhone専用です。</p>
</main>
<script>
  // #のあとは招待のID。サーバーには送られず、この端末の中だけで使います
  (function () {
    var id = (location.hash || '').replace(/^#/, '');
    var ok = /^[A-Za-z0-9_-]{8,80}$/.test(id);
    var open = document.getElementById('open');
    if (ok) {
      open.href = 'potsuri://join?t=' + encodeURIComponent(id);
    } else {
      open.style.display = 'none';
      document.getElementById('bad').className = 'bad show';
    }
  })();
</script>
</body>
</html>
